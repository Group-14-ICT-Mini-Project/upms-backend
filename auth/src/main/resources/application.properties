# Auth Service Configuration
spring.profiles.active=render
spring.application.name=auth-service
server.port=${PORT:${AUTH_SERVER_PORT:8083}}

# Database Configuration
spring.datasource.url=${AUTH_DATASOURCE_URL:jdbc:postgresql://localhost:5436/upms_auth}
spring.datasource.username=${AUTH_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${AUTH_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=mySecretKeyForJWTTokenGenerationAndValidation2024
app.jwt.expiration=3600000
app.jwt.refresh-expiration=86400000

# Microsoft Entra / Outlook SSO Configuration
app.microsoft.tenant-id=${MICROSOFT_TENANT_ID:7ba0a4ed-fe76-431c-ad81-0aa301c54b9d}
app.microsoft.client-id=${MICROSOFT_CLIENT_ID:26168397-d2a9-4ce5-9159-f6dd91f9fecb}
app.microsoft.issuer-uri=https://login.microsoftonline.com/${app.microsoft.tenant-id}/v2.0
app.microsoft.allowed-audience=${MICROSOFT_ALLOWED_AUDIENCE:api://26168397-d2a9-4ce5-9159-f6dd91f9fecb}
app.microsoft.allowed-domain=${MICROSOFT_ALLOWED_DOMAIN:}

# Microsoft Graph mail configuration for admin approval emails
app.mail.graph.tenant-id=${MAIL_GRAPH_TENANT_ID:}
app.mail.graph.client-id=${MAIL_GRAPH_CLIENT_ID:}
app.mail.graph.client-secret=${MAIL_GRAPH_CLIENT_SECRET:}
app.mail.graph.sender=${MAIL_GRAPH_SENDER:}
app.frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:5173/login}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging Configuration
logging.level.root=INFO
logging.level.com.v1.auth=DEBUG
