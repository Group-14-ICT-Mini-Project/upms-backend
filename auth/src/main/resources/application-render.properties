# Render deployment configuration for the auth service

server.port=${PORT:8083}

# Aiven PostgreSQL connection settings
spring.datasource.url=${AUTH_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${AUTH_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${AUTH_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema management on startup
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public

spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation2024}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:86400000}

# Microsoft Graph mail configuration for admin approval emails
app.mail.graph.tenant-id=${MAIL_GRAPH_TENANT_ID:}
app.mail.graph.client-id=${MAIL_GRAPH_CLIENT_ID:}
app.mail.graph.client-secret=${MAIL_GRAPH_CLIENT_SECRET:}
app.mail.graph.sender=${MAIL_GRAPH_SENDER:}
app.frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:5173/login}
