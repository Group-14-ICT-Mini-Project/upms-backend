# Render deployment configuration for the procurement service

server.port=${PORT:${PROCUREMENT_SERVER_PORT:8084}}

# Aiven/Cloud PostgreSQL connection settings
spring.datasource.url=${PROCUREMENT_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${PROCUREMENT_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${PROCUREMENT_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema management on startup
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation2024}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO
logging.level.com.v1.procurement=DEBUG