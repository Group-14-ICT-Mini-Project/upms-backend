# Render deployment configuration for the PROCUREMENT service

server.port=${PORT:8084}

# Aiven PostgreSQL connection settings
spring.datasource.url=${PROCUREMENT_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/upms_procurement}}
spring.datasource.username=${PROCUREMENT_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${PROCUREMENT_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema management on startup
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public

spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation2024}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:86400000}
