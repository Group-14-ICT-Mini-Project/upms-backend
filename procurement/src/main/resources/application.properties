# Procurement Service Configuration
spring.application.name=procurement-service
server.port=${PORT:${PROCUREMENT_SERVER_PORT:8084}}
spring.profiles.active=render

# Database Configuration
spring.datasource.url=${PROCUREMENT_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/upms_procurement}}
spring.datasource.username=${PROCUREMENT_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${PROCUREMENT_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation2024}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO
logging.level.com.v1.procurement=DEBUG