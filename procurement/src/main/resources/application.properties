# Procurement Service Configuration
spring.profiles.active=render
spring.application.name=procurement-service
server.port=${PORT:${PROCUREMENT_SERVER_PORT:8084}}

# Database Configuration
spring.datasource.url=${PROCUREMENT_DATASOURCE_URL:jdbc:postgresql://localhost:5433/upms_procurement}
spring.datasource.username=${PROCUREMENT_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${PROCUREMENT_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation2024}

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging Configuration
logging.level.root=INFO
logging.level.com.v1.procurement=DEBUG
